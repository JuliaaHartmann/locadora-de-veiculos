name: Publicar frontend na Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: locacar-front-producao

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/frontend/.node-version
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Instalar dependências
        working-directory: app/frontend
        run: npm ci

      - name: Compilar frontend para produção
        working-directory: app/frontend
        env:
          LOCADORA_API_URL: https://locacar-api-fachauekgcayfqf7.canadacentral-01.azurewebsites.net/api/v1
        run: npm run build -- --configuration production --define "LOCADORA_API_URL=\"${LOCADORA_API_URL}\""

      - name: Publicar frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          skip_app_build: true
          app_location: app/frontend/dist/locadora-frontend/browser
          output_location: ''
          api_location: ''

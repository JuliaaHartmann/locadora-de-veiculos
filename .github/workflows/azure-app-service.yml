name: Publicar backend na Azure

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: locacar-backend-producao
      cancel-in-progress: false
    defaults:
      run:
        working-directory: app/backend

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5.1.0
        with:
          global-json-file: app/backend/global.json

      - name: Compilar e publicar pacote
        run: |
          dotnet restore src/Locadora.Api/Locadora.Api.csproj --locked-mode
          dotnet publish src/Locadora.Api/Locadora.Api.csproj -c Release --no-restore -o "$RUNNER_TEMP/locacar-api"
          dotnet restore operacao/banco-producao/Locadora.BancoProducao.csproj --locked-mode
          dotnet build operacao/banco-producao/Locadora.BancoProducao.csproj -c Release --no-restore

      - name: Aplicar migrations e permissões SQL
        env:
          SQLSERVER_CONNECTIONSTRING: ${{ secrets.SQLSERVER_CONNECTIONSTRING }}
          SQLSERVER_RUNTIME_CONNECTIONSTRING: ${{ secrets.SQLSERVER_RUNTIME_CONNECTIONSTRING }}
        run: dotnet operacao/banco-producao/bin/Release/net10.0/Locadora.BancoProducao.dll

      - name: Autenticar na Azure via OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        env:
          AZURE_CORE_OUTPUT: none
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configurar App Service
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SQLSERVER_RUNTIME_CONNECTIONSTRING: ${{ secrets.SQLSERVER_RUNTIME_CONNECTIONSTRING }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          LOCACAR_FRONTEND_ORIGIN: ${{ vars.LOCACAR_FRONTEND_ORIGIN }}
        run: ./operacao/Configurar-AppService.ps1

      - name: Publicar API no App Service
        uses: azure/webapps-deploy@de617f46172a906d0617bb0e50d81e9e3aec24c8 # v3.0.1
        with:
          app-name: locacar-api
          resource-group-name: locacar
          package: ${{ runner.temp }}/locacar-api
